apiVersion: apps/v1
kind: Deployment
metadata:
  name: cashflow
  namespace: cashflow-staging
  labels:
    app.kubernetes.io/name: cashflow
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: cashflow
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cashflow
    spec:
      containers:
        - name: cashflow
          image: ghcr.io/your-org/cashflow:replace-me
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: cashflow-config
            - secretRef:
                name: cashflow-secrets
                optional: true
          volumeMounts:
            - name: cashflow-data
              mountPath: /app/data
            - name: cashflow-logs
              mountPath: /app/logs
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: cashflow-data
          persistentVolumeClaim:
            claimName: cashflow-data
        - name: cashflow-logs
          emptyDir: {}
