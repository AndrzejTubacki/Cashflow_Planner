openapi: 3.1.0
info:
  title: Cashflow API
  version: 0.3.0
  description: |
    Published HTTP contract for Cashflow. In none mode, account selection is
    compatibility behavior and not proof of identity. Internal mode uses
    email/password login and server-side sessions. The x-cashflow-budget-id
    header selects a requested budget and must not be treated as proof of
    identity. The deprecated x-cashflow-user-id header remains a none-mode
    budget alias for one compatibility release.
servers:
  - url: http://localhost:3000
tags:
  - name: System
  - name: Profiles
  - name: Auth
  - name: Admin
  - name: Setup
  - name: Snapshot
  - name: Maintenance
  - name: FX
  - name: Settings
  - name: Ledger
  - name: Planning
  - name: Portability
  - name: Backup
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Check process liveness
      tags: [System]
      x-cashflow-scope: global-unscoped
      x-cashflow-mutating: false
      x-cashflow-download-only: false
      responses:
        "200":
          $ref: "#/components/responses/JsonSuccess"
  /readyz:
    get:
      operationId: getReadiness
      summary: Check cheap runtime readiness
      tags: [System]
      x-cashflow-scope: global-unscoped
      x-cashflow-mutating: false
      x-cashflow-download-only: false
      responses:
        "200":
          $ref: "#/components/responses/JsonSuccess"
        "503":
          $ref: "#/components/responses/JsonError"
  /api/system:
    get:
      operationId: getSystem
      summary: Read process diagnostics
      tags: [System]
      x-cashflow-scope: global-unscoped
      x-cashflow-mutating: false
      x-cashflow-download-only: false
      responses:
        "200":
          $ref: "#/components/responses/JsonSuccess"
  /api/users:
    get:
      operationId: listUsers
      summary: List selectable planner profiles
      tags: [Profiles]
      x-cashflow-scope: global-unscoped
      x-cashflow-mutating: false
      x-cashflow-download-only: false
      responses:
        "200":
          $ref: "#/components/responses/JsonSuccess"
    post:
      operationId: createUser
      summary: Create a planner profile
      tags: [Profiles]
      x-cashflow-scope: global-unscoped
      x-cashflow-mutating: true
      x-cashflow-download-only: false
      requestBody:
        $ref: "#/components/requestBodies/CreateUser"
      responses:
        "200":
          $ref: "#/components/responses/JsonSuccess"
        "400":
          $ref: "#/components/responses/ApiError"
        "409":
          $ref: "#/components/responses/ApiError"
  /api/accounts:
    get:
      operationId: listAccounts
      summary: List selectable accounts in none mode
      tags: [Profiles]
      x-cashflow-scope: global-unscoped
      x-cashflow-mutating: false
      x-cashflow-download-only: false
      responses:
        "200":
          $ref: "#/components/responses/JsonSuccess"
    post:
      operationId: createAccount
      summary: Create an account and first budget in none mode
      tags: [Profiles]
      x-cashflow-scope: global-unscoped
      x-cashflow-mutating: true
      x-cashflow-download-only: false
      requestBody:
        $ref: "#/components/requestBodies/CreateUser"
      responses:
        "200":
          $ref: "#/components/responses/JsonSuccess"
        "400":
          $ref: "#/components/responses/ApiError"
        "409":
          $ref: "#/components/responses/ApiError"
  /api/accounts/{accountId}/budgets:
    get:
      operationId: listAccountBudgets
      summary: List budgets available to the selected account
      tags: [Profiles]
      x-cashflow-scope: user-scoped
      x-cashflow-mutating: false
      x-cashflow-download-only: false
      parameters:
        - $ref: "#/components/parameters/AccountId"
      responses:
        "200":
          $ref: "#/components/responses/JsonSuccess"
        "401":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/ApiError"
  /api/auth/config:
    get:
      operationId: getPublicAuthConfig
      summary: Read safe public authentication mode configuration
      tags: [Auth]
      x-cashflow-scope: global-unscoped
      x-cashflow-mutating: false
      x-cashflow-download-only: false
      responses:
        "200":
          $ref: "#/components/responses/JsonSuccess"
  /api/auth/internal/password:
    post:
      operationId: completeInternalPasswordSetup
      summary: Consume a one-time password setup or reset token
      tags: [Auth]
      x-cashflow-scope: global-unscoped
      x-cashflow-mutating: true
      x-cashflow-download-only: false
      requestBody:
        $ref: "#/components/requestBodies/InternalPasswordSetup"
      responses:
        "200":
          $ref: "#/components/responses/JsonSuccess"
        "400":
          $ref: "#/components/responses/ApiError"
        "409":
          $ref: "#/components/responses/ApiError"
  /api/auth/external/login:
    post:
      operationId: loginExternal
      summary: Log in from trusted reverse-proxy identity headers
      tags: [Auth]
      x-cashflow-scope: global-unscoped
      x-cashflow-mutating: true
      x-cashflow-download-only: false
      responses:
        "200":
          $ref: "#/components/responses/JsonSuccess"
        "401":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/ApiError"
        "409":
          $ref: "#/components/responses/ApiError"
  /api/auth/internal/login:
    post:
      operationId: loginInternal
      summary: Log in with internal email/password credentials
      tags: [Auth]
      x-cashflow-scope: global-unscoped
      x-cashflow-mutating: true
      x-cashflow-download-only: false
      requestBody:
        $ref: "#/components/requestBodies/InternalLogin"
      responses:
        "200":
          $ref: "#/components/responses/JsonSuccess"
        "401":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/ApiError"
  /api/auth/internal/register:
    post:
      operationId: registerInternal
      summary: Register an internal account from an email budget invitation
      tags: [Auth]
      x-cashflow-scope: global-unscoped
      x-cashflow-mutating: true
      x-cashflow-download-only: false
      requestBody:
        $ref: "#/components/requestBodies/InternalRegister"
      responses:
        "200":
          $ref: "#/components/responses/JsonSuccess"
        "400":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/ApiError"
        "404":
          $ref: "#/components/responses/ApiError"
        "409":
          $ref: "#/components/responses/ApiError"
  /api/auth/providers/{providerId}/login/start:
    post:
      operationId: startAuthProviderLogin
      summary: Start internal-mode login through a configured identity provider
      tags: [Auth]
      x-cashflow-scope: global-unscoped
      x-cashflow-mutating: true
      x-cashflow-download-only: false
      parameters:
        - $ref: "#/components/parameters/ProviderId"
      responses:
        "200":
          $ref: "#/components/responses/JsonSuccess"
        "400":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/ApiError"
        "404":
          $ref: "#/components/responses/ApiError"
        "409":
          $ref: "#/components/responses/ApiError"
  /api/auth/providers/{providerId}/link/start:
    post:
      operationId: startAuthProviderLink
      summary: Start explicit identity-provider linking for the signed-in account
      tags: [Auth]
      x-cashflow-scope: user-scoped
      x-cashflow-mutating: true
      x-cashflow-download-only: false
      parameters:
        - $ref: "#/components/parameters/ProviderId"
      responses:
        "200":
          $ref: "#/components/responses/JsonSuccess"
        "401":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/ApiError"
        "404":
          $ref: "#/components/responses/ApiError"
  /api/auth/providers/{providerId}/callback:
    get:
      operationId: completeAuthProviderCallback
      summary: Complete a configured identity-provider authorization-code callback
      tags: [Auth]
      x-cashflow-scope: global-unscoped
      x-cashflow-mutating: true
      x-cashflow-download-only: false
      parameters:
        - $ref: "#/components/parameters/ProviderId"
      responses:
        "302":
          description: Redirects back to the browser app after issuing a session cookie.
        "400":
          $ref: "#/components/responses/ApiError"
        "401":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/ApiError"
        "409":
          $ref: "#/components/responses/ApiError"
  /api/session:
    get:
      operationId: getSession
      summary: Validate the selected profile session shape
      tags: [Profiles]
      x-cashflow-scope: user-scoped
      x-cashflow-mutating: false
      x-cashflow-download-only: false
      parameters:
        - $ref: "#/components/parameters/BudgetId"
      responses:
        "200":
          $ref: "#/components/responses/JsonSuccess"
        "404":
          $ref: "#/components/responses/ApiError"
  /api/session/select:
    post:
      operationId: selectUser
      summary: Select or initialize the built-in local profile
      tags: [Profiles]
      x-cashflow-scope: global-unscoped
      x-cashflow-mutating: true
      x-cashflow-download-only: false
      requestBody:
        $ref: "#/components/requestBodies/SelectUser"
      responses:
        "200":
          $ref: "#/components/responses/JsonSuccess"
        "400":
          $ref: "#/components/responses/ApiError"
        "404":
          $ref: "#/components/responses/ApiError"
  /api/session/select-account:
    post:
      operationId: selectAccount
      summary: Create a none-mode account session before budget selection
      tags: [Profiles]
      x-cashflow-scope: global-unscoped
      x-cashflow-mutating: true
      x-cashflow-download-only: false
      requestBody:
        $ref: "#/components/requestBodies/SelectAccount"
      responses:
        "200":
          $ref: "#/components/responses/JsonSuccess"
        "400":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/ApiError"
        "404":
          $ref: "#/components/responses/ApiError"
  /api/logout:
    post:
      operationId: logout
      summary: Return an empty session shape
      tags: [Profiles]
      x-cashflow-scope: global-unscoped
      x-cashflow-mutating: true
      x-cashflow-download-only: false
      responses:
        "200":
          $ref: "#/components/responses/JsonSuccess"
  /api/budgets:
    get:
      operationId: listBudgets
      summary: List budgets available to the current account session
      tags: [Profiles]
      x-cashflow-scope: user-scoped
      x-cashflow-mutating: false
      x-cashflow-download-only: false
      responses:
        "200":
          $ref: "#/components/responses/JsonSuccess"
        "401":
          $ref: "#/components/responses/ApiError"
    post:
      operationId: createBudget
      summary: Create a new budget owned by the current account
      tags: [Profiles]
      x-cashflow-scope: user-scoped
      x-cashflow-mutating: true
      x-cashflow-download-only: false
      requestBody:
        $ref: "#/components/requestBodies/CreateBudget"
      responses:
        "200":
          $ref: "#/components/responses/JsonSuccess"
        "400":
          $ref: "#/components/responses/ApiError"
        "401":
          $ref: "#/components/responses/ApiError"
  /api/budgets/{budgetId}/select:
    post:
      operationId: selectBudget
      summary: Select a budget for the current account session
      tags: [Profiles]
      x-cashflow-scope: user-scoped
      x-cashflow-mutating: true
      x-cashflow-download-only: false
      parameters:
        - $ref: "#/components/parameters/PathBudgetId"
      responses:
        "200":
          $ref: "#/components/responses/JsonSuccess"
        "401":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/ApiError"
        "404":
          $ref: "#/components/responses/ApiError"
  /api/budgets/{budgetId}:
    put:
      operationId: renameBudget
      summary: Rename a budget without changing its storage key
      tags: [Profiles]
      x-cashflow-scope: user-scoped
      x-cashflow-mutating: true
      x-cashflow-download-only: false
      parameters:
        - $ref: "#/components/parameters/PathBudgetId"
      requestBody:
        $ref: "#/components/requestBodies/CreateBudget"
      responses:
        "200":
          $ref: "#/components/responses/JsonSuccess"
        "400":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/ApiError"
        "404":
          $ref: "#/components/responses/ApiError"
    delete:
      operationId: purgeBudget
      summary: Permanently purge an archived budget after safety export
      description: >
        Writes a deleted-budget recovery export for planner data before removing
        the budget storage. The export excludes operational/private settings,
        memberships, invitations, sessions, credentials, and global roles.
      tags: [Profiles]
      x-cashflow-scope: user-scoped
      x-cashflow-mutating: true
      x-cashflow-download-only: false
      parameters:
        - $ref: "#/components/parameters/PathBudgetId"
      responses:
        "200":
          $ref: "#/components/responses/JsonSuccess"
        "403":
          $ref: "#/components/responses/ApiError"
        "404":
          $ref: "#/components/responses/ApiError"
        "409":
          $ref: "#/components/responses/ApiError"
  /api/budgets/{budgetId}/archive:
    post:
      operationId: archiveBudget
      summary: Archive an active budget
      tags: [Profiles]
      x-cashflow-scope: user-scoped
      x-cashflow-mutating: true
      x-cashflow-download-only: false
      parameters:
        - $ref: "#/components/parameters/PathBudgetId"
      responses:
        "200":
          $ref: "#/components/responses/JsonSuccess"
        "403":
          $ref: "#/components/responses/ApiError"
        "409":
          $ref: "#/components/responses/ApiError"
  /api/budgets/{budgetId}/export:
    get:
      operationId: exportBudgetBeforeDelete
      summary: Download a full export for a specific budget
      tags: [Profiles]
      x-cashflow-scope: user-scoped
      x-cashflow-mutating: false
      x-cashflow-download-only: true
      parameters:
        - $ref: "#/components/parameters/PathBudgetId"
      responses:
        "200":
          $ref: "#/components/responses/JsonDownload"
        "403":
          $ref: "#/components/responses/ApiError"
        "404":
          $ref: "#/components/responses/ApiError"
  /api/budgets/{budgetId}/restore:
    post:
      operationId: restoreBudgetMetadata
      summary: Restore an archived budget metadata record
      tags: [Profiles]
      x-cashflow-scope: user-scoped
      x-cashflow-mutating: true
      x-cashflow-download-only: false
      parameters:
        - $ref: "#/components/parameters/PathBudgetId"
      responses:
        "200":
          $ref: "#/components/responses/JsonSuccess"
        "403":
          $ref: "#/components/responses/ApiError"
        "409":
          $ref: "#/components/responses/ApiError"
  /api/budgets/{budgetId}/members:
    get:
      operationId: listBudgetMembers
      summary: List members of a budget
      tags: [Profiles]
      x-cashflow-scope: user-scoped
      x-cashflow-mutating: false
      x-cashflow-download-only: false
      parameters:
        - $ref: "#/components/parameters/PathBudgetId"
      responses:
        "200":
          $ref: "#/components/responses/JsonSuccess"
        "403":
          $ref: "#/components/responses/ApiError"
  /api/budgets/{budgetId}/members/{accountId}:
    put:
      operationId: updateBudgetMemberRole
      summary: Change a budget member role
      tags: [Profiles]
      x-cashflow-scope: user-scoped
      x-cashflow-mutating: true
      x-cashflow-download-only: false
      parameters:
        - $ref: "#/components/parameters/PathBudgetId"
        - $ref: "#/components/parameters/AccountId"
      requestBody:
        $ref: "#/components/requestBodies/MemberRole"
      responses:
        "200":
          $ref: "#/components/responses/JsonSuccess"
        "400":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/ApiError"
        "409":
          $ref: "#/components/responses/ApiError"
    delete:
      operationId: removeBudgetMember
      summary: Remove a non-owner budget member
      tags: [Profiles]
      x-cashflow-scope: user-scoped
      x-cashflow-mutating: true
      x-cashflow-download-only: false
      parameters:
        - $ref: "#/components/parameters/PathBudgetId"
        - $ref: "#/components/parameters/AccountId"
      responses:
        "200":
          $ref: "#/components/responses/JsonSuccess"
        "403":
          $ref: "#/components/responses/ApiError"
        "409":
          $ref: "#/components/responses/ApiError"
  /api/budgets/{budgetId}/leave:
    post:
      operationId: leaveBudget
      summary: Leave a budget as a non-owner member
      tags: [Profiles]
      x-cashflow-scope: user-scoped
      x-cashflow-mutating: true
      x-cashflow-download-only: false
      parameters:
        - $ref: "#/components/parameters/PathBudgetId"
      responses:
        "200":
          $ref: "#/components/responses/JsonSuccess"
        "409":
          $ref: "#/components/responses/ApiError"
  /api/budgets/{budgetId}/transfer-ownership:
    post:
      operationId: transferBudgetOwnership
      summary: Transfer budget ownership to another member
      tags: [Profiles]
      x-cashflow-scope: user-scoped
      x-cashflow-mutating: true
      x-cashflow-download-only: false
      parameters:
        - $ref: "#/components/parameters/PathBudgetId"
      requestBody:
        $ref: "#/components/requestBodies/TransferOwnership"
      responses:
        "200":
          $ref: "#/components/responses/JsonSuccess"
        "403":
          $ref: "#/components/responses/ApiError"
        "404":
          $ref: "#/components/responses/ApiError"
  /api/budgets/{budgetId}/invitations:
    get:
      operationId: listBudgetInvitations
      summary: List budget invitations
      tags: [Profiles]
      x-cashflow-scope: user-scoped
      x-cashflow-mutating: false
      x-cashflow-download-only: false
      parameters:
        - $ref: "#/components/parameters/PathBudgetId"
      responses:
        "200":
          $ref: "#/components/responses/JsonSuccess"
        "403":
          $ref: "#/components/responses/ApiError"
    post:
      operationId: createBudgetInvitation
      summary: Create an expiring single-use budget invitation
      tags: [Profiles]
      x-cashflow-scope: user-scoped
      x-cashflow-mutating: true
      x-cashflow-download-only: false
      parameters:
        - $ref: "#/components/parameters/PathBudgetId"
      requestBody:
        $ref: "#/components/requestBodies/BudgetInvitation"
      responses:
        "200":
          $ref: "#/components/responses/JsonSuccess"
        "400":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/ApiError"
  /api/budgets/{budgetId}/invitations/{invitationId}:
    delete:
      operationId: revokeBudgetInvitation
      summary: Revoke a pending budget invitation
      tags: [Profiles]
      x-cashflow-scope: user-scoped
      x-cashflow-mutating: true
      x-cashflow-download-only: false
      parameters:
        - $ref: "#/components/parameters/PathBudgetId"
        - $ref: "#/components/parameters/InvitationId"
      responses:
        "200":
          $ref: "#/components/responses/JsonSuccess"
        "403":
          $ref: "#/components/responses/ApiError"
        "409":
          $ref: "#/components/responses/ApiError"
  /api/invitations/accept:
    post:
      operationId: acceptBudgetInvitation
      summary: Accept a budget invitation token
      tags: [Profiles]
      x-cashflow-scope: user-scoped
      x-cashflow-mutating: true
      x-cashflow-download-only: false
      requestBody:
        $ref: "#/components/requestBodies/AcceptInvitation"
      responses:
        "200":
          $ref: "#/components/responses/JsonSuccess"
        "403":
          $ref: "#/components/responses/ApiError"
        "404":
          $ref: "#/components/responses/ApiError"
        "409":
          $ref: "#/components/responses/ApiError"
  /api/admin/options:
    get:
      operationId: getAdminOptions
      summary: Read global defaults for new profiles
      tags: [Admin]
      x-cashflow-scope: admin-global
      x-cashflow-mutating: false
      x-cashflow-download-only: false
      parameters:
        - $ref: "#/components/parameters/BudgetId"
      responses:
        "200":
          $ref: "#/components/responses/JsonSuccess"
        "403":
          $ref: "#/components/responses/ApiError"
    put:
      operationId: updateAdminOptions
      summary: Update global defaults for new profiles
      tags: [Admin]
      x-cashflow-scope: admin-global
      x-cashflow-mutating: true
      x-cashflow-download-only: false
      parameters:
        - $ref: "#/components/parameters/BudgetId"
      requestBody:
        $ref: "#/components/requestBodies/AdminOptions"
      responses:
        "200":
          $ref: "#/components/responses/JsonSuccess"
        "400":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/ApiError"
  /api/admin/accounts:
    get:
      operationId: listAdminAccounts
      summary: List accounts for system administrator management
      tags: [Admin]
      x-cashflow-scope: admin-global
      x-cashflow-mutating: false
      x-cashflow-download-only: false
      parameters:
        - $ref: "#/components/parameters/BudgetId"
      responses:
        "200":
          $ref: "#/components/responses/JsonSuccess"
        "403":
          $ref: "#/components/responses/ApiError"
  /api/admin/accounts/{accountId}:
    put:
      operationId: updateAdminAccount
      summary: Rename or enable/disable an account
      tags: [Admin]
      x-cashflow-scope: admin-global
      x-cashflow-mutating: true
      x-cashflow-download-only: false
      parameters:
        - $ref: "#/components/parameters/BudgetId"
        - $ref: "#/components/parameters/AccountId"
      requestBody:
        $ref: "#/components/requestBodies/AdminAccountUpdate"
      responses:
        "200":
          $ref: "#/components/responses/JsonSuccess"
        "400":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/ApiError"
        "404":
          $ref: "#/components/responses/ApiError"
        "409":
          $ref: "#/components/responses/ApiError"
    delete:
      operationId: deleteAdminAccount
      summary: Mark an account deleted after ownership and membership cleanup
      tags: [Admin]
      x-cashflow-scope: admin-global
      x-cashflow-mutating: true
      x-cashflow-download-only: false
      parameters:
        - $ref: "#/components/parameters/BudgetId"
        - $ref: "#/components/parameters/AccountId"
      responses:
        "200":
          $ref: "#/components/responses/JsonSuccess"
        "403":
          $ref: "#/components/responses/ApiError"
        "404":
          $ref: "#/components/responses/ApiError"
        "409":
          $ref: "#/components/responses/ApiError"
  /api/admin/accounts/{accountId}/system-admin:
    put:
      operationId: setAdminAccountSystemAdmin
      summary: Grant or revoke the system administrator role
      tags: [Admin]
      x-cashflow-scope: admin-global
      x-cashflow-mutating: true
      x-cashflow-download-only: false
      parameters:
        - $ref: "#/components/parameters/BudgetId"
        - $ref: "#/components/parameters/AccountId"
      requestBody:
        $ref: "#/components/requestBodies/AdminAccountSystemAdmin"
      responses:
        "200":
          $ref: "#/components/responses/JsonSuccess"
        "400":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/ApiError"
        "404":
          $ref: "#/components/responses/ApiError"
        "409":
          $ref: "#/components/responses/ApiError"
  /api/admin/accounts/{accountId}/password-reset-token:
    post:
      operationId: createAdminPasswordResetToken
      summary: Create a one-time internal password setup or reset token
      tags: [Admin]
      x-cashflow-scope: admin-global
      x-cashflow-mutating: true
      x-cashflow-download-only: false
      parameters:
