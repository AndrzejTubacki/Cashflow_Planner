<script>

  (function () {
    var preferred = null;
    try {
      preferred = localStorage.getItem("cashflow_preferred_ui");
    } catch (err) {
      // Storage can be unavailable in private contexts; stay on the default UI.
    }
    var override = new URLSearchParams(window.location.search).get("ui");

    // Keep the query and hash: provider sign-in returns with ?cashflow_auth=…#account.
    window.location.replace("/legacy/" + window.location.search + window.location.hash);
  })();
</script>
